<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stechoq 3D</title>
<style>
  :root{
    --gold:#C79A22; --gold-soft:#DFB63C; --ok:#2E9E57; --alert:#D6373C;
    --accent-teal:#0FA3A3;
    /* light theme (body.dark adalah default, di-set di HTML) */
    --bg:#EDEFF4; --panel:rgba(255,255,255,.92); --panel-border:#D5D9E4;
    --text:#1D2333; --muted:#5B6478; --seg-bg:#EDEFF4; --seg-on-text:#171204;
    --chip:rgba(255,255,255,.9); --shadow:0 10px 34px rgba(25,32,60,.16);
    --header:rgba(255,255,255,.86); --header-border:#D5D9E4;
  }
  body.dark{
    --bg:#0D101C; --panel:rgba(20,25,52,.9); --panel-border:#333C6B;
    --text:#E8EAF2; --muted:#98A0B3; --seg-bg:#0D101C;
    --chip:rgba(20,25,52,.88); --shadow:0 12px 40px rgba(0,0,0,.5);
    --header:rgba(15,18,34,.88); --header-border:#2A3358;
    --gold:#DFB63C; --ok:#46C46E; --alert:#E5484D; --accent-teal:#3ED0C2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;color:var(--text)}
  #scene{position:fixed;inset:0}
  .mono{font-family:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace}

  /* ---------- header ---------- */
  #header{position:fixed;top:0;left:0;right:0;height:54px;z-index:20;
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;
    background:var(--header);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--header-border)}
  #brand{font-size:16px;font-weight:600;letter-spacing:.04em;user-select:none}
  #brand b{color:var(--gold);font-weight:700}
  #hRight{display:flex;align-items:center;gap:10px}
  #selAnim{padding:7px 12px;font:inherit;font-size:12.5px;font-weight:600;
    color:var(--text);background:var(--seg-bg);border:1px solid var(--panel-border);
    border-radius:99px;cursor:pointer;max-width:46vw}
  #selAnim option{background:var(--bg);color:var(--text)}
  #selAnim:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  #themeSeg{display:flex;background:var(--seg-bg);border:1px solid var(--panel-border);
    border-radius:99px;overflow:hidden;flex:none}
  #themeSeg button{border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-size:12px;font-weight:600;padding:6px 14px;display:flex;align-items:center;gap:6px;
    transition:background .15s,color .15s}
  #themeSeg button.on{background:var(--gold);color:#171204}
  #themeSeg button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

  /* ---------- panel kiri ---------- */
  #panel{position:fixed;top:70px;left:16px;width:302px;z-index:10;
    max-height:calc(100vh - 100px);overflow-y:auto;
    background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--panel-border);border-radius:14px;padding:16px;
    box-shadow:var(--shadow)}
  #panel h1{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin-bottom:2px}
  #panel .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .seg{display:flex;background:var(--seg-bg);border:1px solid var(--panel-border);
    border-radius:9px;overflow:hidden;margin-bottom:8px}
  .seg button{flex:1;padding:8px 4px;font-size:11.5px;font-weight:600;border:0;
    background:transparent;color:var(--muted);cursor:pointer;letter-spacing:.02em;
    transition:background .15s,color .15s}
  .seg button.on{background:var(--gold);color:var(--seg-on-text)}
  .seg button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

  #selScen{width:100%;padding:8px 10px;margin-bottom:8px;font:inherit;font-size:11.5px;
    font-weight:600;color:var(--text);background:var(--seg-bg);
    border:1px solid var(--panel-border);border-radius:9px;cursor:pointer}
  #selScen option{background:var(--bg);color:var(--text)}
  #selScen:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

  /* play / stop */
  #simRow{display:flex;gap:8px;margin:10px 0 12px}
  #simRow button{flex:1;border:0;border-radius:9px;padding:10px 4px;font-size:12.5px;
    font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:7px;transition:filter .15s,opacity .15s,background .15s}
  #btnPlay{background:var(--ok);color:#fff}
  #btnPlay:hover{filter:brightness(1.07)}
  #btnPlay:disabled{opacity:.45;cursor:default;filter:none}
  #btnStop{background:transparent;color:var(--text);border:1.5px solid var(--panel-border)!important}
  #btnStop:hover{border-color:var(--alert)!important;color:var(--alert)}
  #btnStop:disabled{opacity:.4;cursor:default;border-color:var(--panel-border)!important;color:var(--muted)}
  #simRow button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  #btnRec{width:100%;margin-bottom:12px;padding:9px 4px;border:1.5px solid var(--panel-border);
    border-radius:9px;background:transparent;color:var(--text);font:inherit;font-size:12px;
    font-weight:700;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  #btnRec:hover{border-color:var(--accent-teal);color:var(--accent-teal)}
  #btnRec.on{background:var(--alert);border-color:var(--alert);color:#fff}
  #btnRec:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .checks{display:flex;flex-direction:column;gap:6px;margin:2px 0 10px}
  .checks label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);cursor:pointer}
  .checks input{accent-color:var(--gold);width:14px;height:14px}
  #stats{border-top:1px solid var(--panel-border);padding-top:10px;font-size:11.5px;
    line-height:1.75;color:var(--muted)}
  #stats b{color:var(--gold);font-weight:700}
  #note{margin-top:8px;font-size:10.5px;line-height:1.5;color:var(--muted);
    border-left:2px solid var(--gold);padding-left:8px}
  #note b{color:var(--text)}

  /* ---------- legenda ---------- */
  #legend{position:fixed;right:16px;bottom:16px;z-index:10;display:flex;flex-wrap:wrap;
    gap:6px;max-width:360px;justify-content:flex-end}
  .chip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text);
    background:var(--chip);border:1px solid var(--panel-border);border-radius:99px;
    padding:4px 10px 4px 6px;backdrop-filter:blur(8px)}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}

  /* ---------- status alur ---------- */
  #flow{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    background:var(--chip);border:1px solid var(--panel-border);border-radius:99px;
    padding:8px 20px;font-size:11.5px;letter-spacing:.03em;color:var(--muted);
    backdrop-filter:blur(8px);white-space:nowrap;box-shadow:var(--shadow)}
  #flow b{color:var(--gold)}
  #flow.bad{border-color:var(--alert);color:var(--text)}
  #flow.bad b{color:var(--alert)}

  @media (max-width:720px){
    #panel{width:calc(100vw - 32px)}
    #legend{display:none}
    #flow{max-width:calc(100vw - 24px);white-space:normal;text-align:center}
    #selAnim{max-width:38vw}
  }
</style>
</head>
<body class="dark">
<header id="header">
  <div id="brand">Stechoq&nbsp;<b>3D</b></div>
  <div id="hRight">
    <select id="selAnim" aria-label="Pilih animasi"></select>
    <div id="themeSeg" role="group" aria-label="Tema tampilan">
      <button data-t="dark" class="on">&#9789; Dark</button>
      <button data-t="light">&#9728; Light</button>
    </div>
  </div>
</header>

<div id="scene"></div>

<div id="panel">
  <h1 id="panelTitle"></h1>
  <div class="sub" id="panelSub"></div>

  <div class="seg" id="segVariant"></div>
  <div class="seg" id="segView">
    <button data-v="3d" class="on">Tampilan 3D</button>
    <button data-v="top">Denah (atas)</button>
  </div>

  <select id="selScen" aria-label="Skenario"></select>

  <div id="simRow">
    <button id="btnPlay">&#9654;&nbsp;Play</button>
    <button id="btnStop" disabled>&#9632;&nbsp;Stop</button>
  </div>

  <button id="btnRec">&#11044;&nbsp;Rekam video 1080p</button>

  <div class="checks">
    <label><input type="checkbox" id="ckCov" checked> Zona baca RFID</label>
    <label><input type="checkbox" id="ckPath" checked> Jalur &amp; pelaku</label>
    <label><input type="checkbox" id="ckLabel" checked> Label ruangan</label>
    <label><input type="checkbox" id="ckLoop"> Ulang otomatis (pameran)</label>
  </div>

  <div id="stats" class="mono"></div>
  <div id="note"></div>
</div>

<div id="legend"></div>

<div id="flow" class="mono">Memuat&hellip;</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/anim-warehouse.js"></script>
<script src="js/anim-injection.js"></script>
<script src="js/anim-picktolamp.js"></script>
<script src="js/anim-vault.js"></script>
<script src="animations.js"></script>
<script>
(function(){
  const flow=document.getElementById('flow');
  if(!window.THREE){ flow.textContent='Gagal memuat Three.js — periksa koneksi internet.'; return; }
  if(!window.SIMLAY){ flow.textContent='Gagal memuat js/core.js.'; return; }
  window.SIMLAY.boot();
})();
</script>
</body>
</html>
